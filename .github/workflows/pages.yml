name: Tests & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: App-Dateien zusammenstellen
        run: |
          mkdir _site
          cp index.html styles.css app.js core.js providers.js sw.js manifest.webmanifest _site/
          cp -r icons _site/icons
          # Cache-Name pro Commit, damit Updates auf dem iPhone ankommen
          sed -i "s/spritfinder-v[0-9]*/spritfinder-${GITHUB_SHA::7}/" _site/sw.js
          grep -n "const CACHE" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
