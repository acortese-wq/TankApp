<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spritfinder</title>
  <meta name="description" content="Nächste offene Tankstelle in der Schweiz mit aktuellem Preis – ein Tipp, und Google Maps navigiert.">
  <meta name="theme-color" content="#0f1720">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sprit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1>Spritfinder</h1>
      <button id="btn-refresh" class="icon-btn" type="button" aria-label="Aktualisieren">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="controls">
      <div class="seg" role="radiogroup" aria-label="Kraftstoff" id="fuel-group">
        <button type="button" role="radio" data-fuel="b95">Bleifrei 95</button>
        <button type="button" role="radio" data-fuel="b98">Bleifrei 98</button>
        <button type="button" role="radio" data-fuel="diesel">Diesel</button>
      </div>
      <div class="seg" role="radiogroup" aria-label="Sortierung" id="sort-group">
        <button type="button" role="radio" data-sort="dist">Entfernung</button>
        <button type="button" role="radio" data-sort="price">Preis</button>
      </div>
    </div>
  </header>

  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="actions" class="actions" hidden></div>
    <ol id="list" class="list"></ol>
    <p id="foot" class="foot"></p>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settings-form">
      <h2>Einstellungen</h2>

      <label class="field">
        <span>Google-Maps-API-Key</span>
        <input id="set-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…">
        <small>Für «Places API (New)». Der Key bleibt nur auf diesem Gerät. Bitte in der Google Cloud Console auf deine Web-Adresse (HTTP-Referrer) und auf diese API beschränken.</small>
      </label>

      <label class="check">
        <input id="set-demo" type="checkbox">
        <span>Demo-Daten (zum Ausprobieren)</span>
      </label>

      <div class="dialog-actions">
        <button value="cancel" class="btn secondary">Abbrechen</button>
        <button value="save" class="btn primary" id="settings-save">Speichern</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
